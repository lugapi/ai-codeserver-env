name: ai-codeserver-env

services:
  codeserver:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      # Coolify: routes your domain to container port 8080 (required with expose:)
      SERVICE_FQDN_CODESERVER_8080: /
      PASSWORD: ${SERVICE_PASSWORD_CODESERVER}
      OPTIONAL_EXTENSION_UPDATE: "false"
    labels:
      - traefik.http.services.codeserver.loadbalancer.server.port=8080
    volumes:
      - code-server-data:/home/coder/.local/share/code-server
      - code-server-config:/home/coder/.config/code-server
      - workspace:/home/coder/workspace
      - coder-ssh:/home/coder/.ssh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  code-server-data:
  code-server-config:
  workspace:
  coder-ssh:
